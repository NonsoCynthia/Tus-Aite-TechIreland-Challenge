# Everything: the dataset stack (Postgres + pgAdmin + loader), the graph
# (Oxigraph), and the retrieval service, in one compose project so every
# service shares one network and can reach the others by hostname (`db`,
# `oxigraph`, `retrieval`) without cross-project network wiring.
#
# Explicit project name, preserved from when this was dataset/docker-compose.yml,
# so existing local volumes (db_data, pgadmin_data) are picked up rather than
# orphaned:
#     triage_referral_data_db_data
#     triage_referral_data_pgadmin_data
#     triage_referral_data_oxigraph_data
# `make reset` only ever removes volumes declared below, namespaced to this
# project -- see the root Makefile.
name: triage_referral_data

services:
  db:
    image: postgres:16-alpine
    container_name: triage_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: triage_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-provisioned server connection. `make reset` recreates db_data/pgadmin_data,
      # which would otherwise wipe the saved connection on every reset. Mounting it
      # read-only means the server is always there.
      - ./dataset/db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  loader:
    build: ./dataset
    container_name: triage_loader
    profiles: ["tools"]
    # One .env (root) is authoritative for the whole stack -- these are passed
    # through explicitly rather than `env_file: dataset/.env`, so there's no
    # second file that also needs to be kept in sync.
    environment:
      PGHOST: db
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HF_TOKEN: ${HF_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dataset:/app

  oxigraph:
    image: oxigraph/oxigraph:latest
    container_name: triage_oxigraph
    ports:
      - "7878:7878"
    volumes:
      - oxigraph_data:/data
    command: serve --location /data --bind 0.0.0.0:7878

  # Retrieval service (conductor/tracks/retrieval-service_20260904): the single
  # write/read path between Postgres core/agent and the graph, for the
  # not-yet-built agents and the clinician UI. Implements ADR-002. Port is
  # published to the host (not internal-only) -- see that track's spec.md FR1.
  retrieval:
    # Context is the repo root, not ./retrieval -- FR3's wait-counters
    # endpoint wraps kg/queries/wait_counters.rq unmodified, so the build
    # needs that file too (see retrieval/Dockerfile).
    build:
      context: .
      dockerfile: retrieval/Dockerfile
    container_name: triage_retrieval
    # One .env (root) is authoritative for the whole stack -- same reasoning
    # as the loader service above, no second file to keep in sync.
    environment:
      OXIGRAPH_QUERY_URL: http://oxigraph:7878/query
      OXIGRAPH_UPDATE_URL: http://oxigraph:7878/update
      RETRIEVAL_BEARER_TOKENS: ${RETRIEVAL_BEARER_TOKENS}
      RETRIEVAL_DB_URL: ${RETRIEVAL_DB_URL}
    ports:
      - "${RETRIEVAL_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      oxigraph:
        condition: service_started

  rationale:
    build:
      context: .
      dockerfile: rationale/Dockerfile
    profiles: ["tools"]
    environment:
      RETRIEVAL_BASE_URL: http://retrieval:8000
      RETRIEVAL_BEARER_TOKENS: ${RETRIEVAL_BEARER_TOKENS}
    depends_on:
      retrieval:
        condition: service_started

  rationale-api:
    build:
      context: .
      dockerfile: rationale/Dockerfile
    container_name: triage_rationale_api
    profiles: ["api"]
    entrypoint:
      [
        "uvicorn",
        "rationale.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
      ]
    environment:
      RETRIEVAL_BASE_URL: http://retrieval:8000
      RETRIEVAL_BEARER_TOKENS: ${RETRIEVAL_BEARER_TOKENS}
    ports:
      - "${RATIONALE_PORT:-8010}:8010"
    depends_on:
      retrieval:
        condition: service_started

volumes:
  db_data:
  pgadmin_data:
  oxigraph_data:
