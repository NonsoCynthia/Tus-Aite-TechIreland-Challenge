  counted_as: >-
    Every mapping in this file that carries a `kind` key. Three of the fitted entries
    are series rather than single scalars (the 2019-2023 inpatient and day-patient
    occupancy histories, and the 2019-2024 emergency ALOS history); each is counted
    once, as one parameter.
  assumed_is_zero_because: >-
    Every number in this file traces to a cell, a sentence or a footnote in RS213.
