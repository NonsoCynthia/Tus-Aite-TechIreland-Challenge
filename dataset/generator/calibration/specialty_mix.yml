# ---------------------------------------------------------------------------
# Stability: the same renormalised proportion recomputed on each of the 7
# monthly snapshots, same method. Bounds the cost of the snapshot choice.
# ---------------------------------------------------------------------------
stability:
  kind: fitted
  note: >-
    min/max of each renormalised proportion across the 7 monthly snapshots in the file,
    each recomputed with SDC excluded and January duplicate keys summed. Spread is at most
    0.011595 in absolute proportion, so the mix is stable over the 7 months observed
    and no snapshot choice within the file would move it much.
  per_specialty:
    "2600": {min: 0.110254, max: 0.114747, spread: 0.004493, label: General Surgery}
    "0100": {min: 0.148854, max: 0.152172, spread: 0.003318, label: Cardiology}
    "0300": {min: 0.210521, max: 0.219778, spread: 0.009257, label: Dermatology}
    "1800": {min: 0.269612, max: 0.281208, spread: 0.011595, label: Orthopaedics}
    "0700": {min: 0.072593, max: 0.075578, spread: 0.002986, label: Gastro-Enterology}
    "0600": {min: 0.155056, max: 0.159372, spread: 0.004316, label: Otolaryngology (ENT)}
    "0601": {min: 0.014476, max: 0.01607, spread: 0.001594, label: Paediatric ENT}
  our_seven_share_of_national:
    min: 0.435993
    max: 0.44017
    spread: 0.004177

