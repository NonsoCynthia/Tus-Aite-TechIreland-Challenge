# NTPF outpatient waiting-list specialty mix + wait-band distribution.
# Generated from the raw NTPF CSV; every leaf parameter carries a 'kind'.

provenance:
  source: National Treatment Purchase Fund (NTPF) — Outpatient Waiting List by Speciality, National
  url: https://www.ntpf.ie/app/uploads/2026/08/OpenData_OPNational02_2026.csv
  discovered_from: https://www.ntpf.ie/waiting-list-data/open-data/
  discovered_as: "OP Waiting List by Speciality 2026"
  licence: unstated
  licence_note: >-
    No licence is stated on the NTPF open-data page, and a data.gov.ie package_search
    for this dataset returns 0 results. Recorded as unstated rather than asserting one.
  granularity: national, monthly snapshot, by speciality x adult/child x 4 wait-time bands
  retrieved: 2026-08-30
  file: generator/calibration/_raw/OpenData_OPNational02_2026.csv
  sha256: 275f2682e2090e1681d0b324e36dbba010c460d188ee853b37f1f6b1a75906da
  bytes: 33688
  server_last_modified: 'Thu, 13 Aug 2026 15:14:04 GMT'
  encoding: utf-8-sig
  raw_shape: [561, 8]
  snapshots_in_file: 7
  snapshot_dates: [2026-01-29, 2026-02-26, 2026-03-26, 2026-04-30, 2026-05-28, 2026-06-25, 2026-07-30]
  snapshot_used: 2026-07-30
  longer_series_available: https://www.ntpf.ie/app/uploads/2026/01/OpenData_OPNational02_2025.csv

# ---------------------------------------------------------------------------
# Method: choices made in reducing the raw file to these numbers.
# ---------------------------------------------------------------------------
method:

  snapshot_selection:
    value: 2026-07-30
    kind: modelled
    reason: >-
      The 2026 file is year-to-date with 7 monthly snapshots. The most recent one is used
      rather than a 7-month average, so the mix reflects the current state of the list
      rather than smearing a list that is monotonically growing (631,607 -> 683,553 over
      the 7 snapshots). Cross-snapshot spread is recorded under 'stability' below and is
      small, so the choice is not load-bearing.

  duplicate_key_handling:
    value: groupby-sum on (ArchiveDate, Adult_Child, Speciality)
    kind: modelled
    reason: >-
      The 29/01/2026 snapshot carries 28 duplicated (date, adult/child, speciality) keys
      with no column distinguishing the two rows (106 rows vs ~76 in every other month).
      Summing each pair reproduces a series continuous with February — e.g. Adult
      Cardiology 39,197 + 2,430 = 41,627 against 41,730 in February — so the pair is a
      split of one figure, not a repeat. Dropping duplicates instead would understate
      January. Applied to the whole file; it is a no-op for the other six snapshots.

  adult_child_aggregation:
    value: summed across Adult and Child within each NTPF Speciality string
    kind: modelled
    reason: >-
      Our seven codes are specialties, not age-split cohorts, so Adult and Child rows of
      the same NTPF Speciality string are summed. No double-counting arises against 0601:
      NTPF publishes 'Paediatric ENT' as its own Speciality string, disjoint from the
      'Otolaryngology (ENT)' rows, so 0600 and 0601 draw on different lines of the file.

  band_share_denominator:
    value: sum of the four band columns (not the published Total column)
    kind: modelled
    reason: >-
      126 of 561 raw rows have band-sum != Total, always by exactly +/-1
      (band grand total 4,611,536 vs Total column 4,611,512, a gap of
      24) — NTPF disclosure-control rounding, not a parse error.
      Band shares therefore divide by the band sum so each specialty's four shares close
      to 1.0; the published Total is what proportions divide by. Per-specialty band-sum
      minus Total is recorded as 'band_total_discrepancy' so the gap stays visible.

  proportion_denominator:
    value: renormalised across our seven specialties
    kind: modelled
    reason: >-
      'proportion' is renormalised so the seven sum to exactly 1.0, as required for a
      draw over our specialty set. The unrenormalised share of the national list is kept
      alongside as 'share_of_national' so the seven can be placed back in national context
      — together they are 0.435993 of the ex-SDC national list.

# ---------------------------------------------------------------------------
# Statistical disclosure control: NTPF aggregates counts below 20 into a
# 'Small Volume Specialties' bucket. Those rows are EXCLUDED from every
# denominator and proportion below.
# ---------------------------------------------------------------------------
sdc_exclusion:
  excluded_category: Small Volume Specialties
  excluded: true
  rows_excluded_from_snapshot_used:
    value: 2
    kind: fitted
    note: >-
      2 rows in the 2026-07-30 snapshot (one Adult, one Child),
      1278 patients, dropped before any denominator was formed.
  rows_excluded_whole_file:
    value: 16
    kind: fitted
    note: >-
      16 raw rows across all 7 snapshots, which reduce to 14 unique
      (date, adult/child) keys after the January duplicate-key sum; 8963 patients in total.
  patients_excluded_from_snapshot_used:
    value: 1278
    kind: fitted
    note: 1278 of 683553 patients in the snapshot, i.e. 0.1870% of the national list.
  effect_on_our_seven:
    value: none directly
    kind: fitted
    note: >-
      All seven of our specialties clear the disclosure threshold in the snapshot used, so
      none of their counts sit inside the excluded bucket. One indirect effect is measured:
      Child Cardiology surfaces as its own line in exactly one of the 7 snapshots
      (26/03/2026, 21 patients) and is inside Small Volume in the other six, so 0100 is
      adult-only in the snapshot used. The censored paediatric cardiology count is
      therefore under 20 — bounded by the threshold, not estimated here.

# ---------------------------------------------------------------------------
# Denominators for the snapshot used, after SDC exclusion.
# ---------------------------------------------------------------------------
denominators:
  national_waiting_ex_sdc:
    value: 682275
    kind: fitted
    note: sum of Total over the 75 non-SDC rows (57 specialties) in the 2026-07-30 snapshot.
  national_waiting_incl_sdc:
    value: 683553
    kind: fitted
    note: published national outpatient total for the snapshot, retained for reconciliation only.
  our_seven_waiting:
    value: 297467
    kind: fitted
    note: denominator for the renormalised 'proportion' field.
  our_seven_share_of_national:
    value: 0.4359928
    kind: fitted
    note: 297467 of 682275; the seven cover just under half the ex-SDC national outpatient list.

# ---------------------------------------------------------------------------
# Specialty matching. All seven matched by exact NTPF Speciality string —
# no fuzzy matching, no splitting, no invented lines.
# ---------------------------------------------------------------------------
matching:
  strategy: exact string equality against the NTPF 'Speciality' column
  ntpf_distinct_specialities: 59
  all_seven_matched_exactly: true
  paediatric_ent_0601:
    has_distinct_ntpf_line: true
    kind: fitted
    note: >-
      0601 does have its own NTPF line. 'Paediatric ENT' is one of the 59 distinct
      Speciality values, present in all 7 snapshots, Child-only, 4,306 patients in
      the snapshot used. Its proportion is measured, not assumed, and no adult/paediatric
      split had to be invented. Note NTPF also lists a Child row under 'Otolaryngology
      (ENT)' (7,666 patients) which is a separate line and stays with 0600 — NTPF
      does not document how a paediatric ENT patient is routed between the two, so no
      reallocation between 0600 and 0601 is attempted.
  near_miss_lines_deliberately_excluded:
    value: [Paed Cardiology, Paediatric Dermatology, Paed Gastro-Enterol, Paed Orthopaedic]
    kind: modelled
    reason: >-
      NTPF publishes separate paediatric lines whose names resemble four of our codes.
      They are distinct Speciality strings mapping to no code in our set, so they are left
      in the national denominator and out of the seven. Folding them in would change the
      meaning of the codes; only 0601 is a paediatric code in our set and it has its own
      exact match.

# ---------------------------------------------------------------------------
# Fitted mix. 'proportion' is renormalised over the seven and sums to exactly 1.0.
# 'share_of_national' is the unrenormalised share of the ex-SDC national list.
# ---------------------------------------------------------------------------
renormalised: true
renormalisation_note: >-
  The seven specialties are 43.5993% of the ex-SDC national outpatient list
  (297467 of 682275). Each 'proportion' below divides by 297467, not by
  682275, so the seven sum to exactly 1.0 at the 7 decimal places written.

