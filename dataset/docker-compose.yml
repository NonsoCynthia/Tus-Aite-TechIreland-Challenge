# Explicit project name. Without this, Compose derives it from the directory name,
# which is implicit and could in principle collide with another project. Pinning it
# means `docker compose down -v` in this file can only ever remove the two volumes
# declared at the bottom of this file, namespaced as:
#     triage_referral_data_db_data
#     triage_referral_data_pgadmin_data
# No volume belonging to any other project is in scope, ever.
name: triage_referral_data

services:
  db:
    image: postgres:16-alpine
    container_name: triage_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: triage_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-provisioned server connection. `make reset` runs `docker compose down -v`,
      # which destroys pgadmin_data and would otherwise wipe the saved connection on
      # every reset. Mounting it read-only means the server is always there.
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  loader:
    build: .
    container_name: triage_loader
    profiles: ["tools"]
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app

volumes:
  db_data:
  pgadmin_data:
