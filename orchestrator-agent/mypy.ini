[mypy]
python_version = 3.12
warn_unused_ignores = True
warn_redundant_casts = True
disallow_untyped_defs = True
# `rationale` is a sibling package (tools.py sys.path-injects the repo root
# at runtime to import it) -- point mypy at the same repo root so it can
# type-check across that boundary statically too, rather than treating it
# as an untyped/missing import.
mypy_path = ..

[mypy-agents.*]
ignore_missing_imports = True
