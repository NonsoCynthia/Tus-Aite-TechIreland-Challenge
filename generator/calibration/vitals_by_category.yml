# Vitals distributions by triage category, fitted from MIMIC-IV-ED.
# Generated from the raw triage table; every number below was measured, not estimated.

provenance:
  source: MIMIC-IV-ED Demo v2.2, triage table
  url: https://physionet.org/files/mimic-iv-ed-demo/2.2/ed/triage.csv.gz
  licence: ODbL 1.0 (open access, no credentialing required)
  granularity: one row per ED stay, vitals recorded at triage
  retrieved: 2026-08-30
  raw_file: generator/calibration/_raw/mimic_triage.csv.gz
  sha256_gz: 086dadcb49adc5f24bdda0e342ec9cf0fbcb2e9595516c5c101d408434e1e09b
  rows_in_source: 222
  rows_with_acuity: 207
  rows_excluded_null_acuity: 15

source_data_quality:
  note: >-
    Three problems found in the MIMIC triage table and excluded rather than silently
    absorbed. A reviewer who downloads MIMIC and computes slightly different means needs to
    be able to see why. Every screened variable keeps its as-measured value in a nested
    unscreened_fitted block.
  excluded_dbp_out_of_range:
    n: 1
    rule: "dbp outside 20-200 mmHg, or dbp > sbp"
    example: {stay_id: 37298974, acuity: 2, dbp: 879, sbp: 111}
    effect_if_kept: "inflates Urgent dbp SD from 16.2235 to 79.7226"
  excluded_temp_unit_error:
    n: 1
    rule: "Celsius value sitting in the Fahrenheit column"
    example: {stay_id: 34992024, acuity: 3, recorded: 36.5, as_fahrenheit_becomes_c: 2.5}
    effect_if_kept: "violates our own CHECK of 30.0-43.0 C; inflates Semi-Urgent temp SD from 0.4783 to 3.636"
  excluded_pain_non_numeric:
    n: 12
    rule: "free-text pain value on a 0-10 numeric rating scale"
    values_seen: [Critical, UA, ett, o, unable, uta]
  excluded_pain_out_of_range:
    n: 7
    rule: "pain > 10 on a 0-10 scale"
    values_seen: [13]
  rows_before: 222
  rows_after: 207

population_caveat:
  note: >-
    MIMIC-IV-ED is an EMERGENCY DEPARTMENT cohort: 115 urgent, 90 semi-urgent, 2 routine.
    An outpatient referral waiting list is close to the inverse - mostly routine. These are
    different populations and the file must not be used as though they were the same.
  vitals_within_category: >-
    Taken from MIMIC. Valid for the two well-populated cells, Urgent and Semi-Urgent.
  category_proportions: >-
    NEVER from MIMIC. They come from NTPF open data and generator/config.yml. Taking the
    category mix from an ED cohort would make the generated waiting list look like an
    emergency department, which it is not.
  asserted_by: >-
    tests/test_plausibility.py asserts the generated triage-category distribution does not
    resemble MIMIC's. If more than 40 per cent of generated referrals are Urgent, the ED
    mix has leaked into the waiting list.

unit_conversions:
  temperature:
    source_unit: fahrenheit
    target_unit: celsius
    formula: (F - 32) * 5 / 9
    applied: true
    note: >-
      MIMIC stores triage temperature in Fahrenheit. Every temperature figure in this file is
      Celsius, converted before any mean or SD was taken. Our schema CHECK constraint is 30.0-43.0 C.

category_mapping:
  note: >-
    MIMIC acuity is the Emergency Severity Index (1 = most urgent, 5 = least). Our triage
    categories run in the opposite direction of severity_rank, so the mapping is stated explicitly.
  map:
    - mimic_acuity: 1-2
      category: Urgent
      code: 1
      severity_rank: 1
    - mimic_acuity: 3
      category: Semi-Urgent
      code: 3
      severity_rank: 2
    - mimic_acuity: 4-5
      category: Routine
      code: 2
      severity_rank: 3

statistics:
  method: >-
    Per category, per column: nulls dropped pairwise (not listwise), so n differs by column and
    is reported for each. SD is the sample standard deviation, ddof=1.

