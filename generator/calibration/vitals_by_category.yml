  source: MIMIC-IV-ED Demo v2.2, triage table
  url: https://physionet.org/files/mimic-iv-ed-demo/2.2/ed/triage.csv.gz
  licence: ODbL 1.0 (open access, no credentialing required)
  granularity: one row per ED stay, vitals recorded at triage
  retrieved: 2026-08-30
  raw_file: generator/calibration/_raw/mimic_triage.csv.gz
  sha256_gz: 086dadcb49adc5f24bdda0e342ec9cf0fbcb2e9595516c5c101d408434e1e09b
  rows_in_source: 222
  rows_with_acuity: 207
  rows_excluded_null_acuity: 15

unit_conversions:
  temperature:
    source_unit: fahrenheit
    target_unit: celsius
    formula: (F - 32) * 5 / 9
    applied: true
    note: >-
      MIMIC stores triage temperature in Fahrenheit. Every temperature figure in this file is
      Celsius, converted before any mean or SD was taken. Our schema CHECK constraint is 30.0-43.0 C.

category_mapping:
  note: >-
    MIMIC acuity is the Emergency Severity Index (1 = most urgent, 5 = least). Our triage
    categories run in the opposite direction of severity_rank, so the mapping is stated explicitly.
  map:
    - mimic_acuity: 1-2
      category: Urgent
      code: 1
      severity_rank: 1
    - mimic_acuity: 3
      category: Semi-Urgent
      code: 3
      severity_rank: 2
    - mimic_acuity: 4-5
      category: Routine
      code: 2
      severity_rank: 3

statistics:
  method: >-
    Per category, per column: nulls dropped pairwise (not listwise), so n differs by column and
    is reported for each. SD is the sample standard deviation, ddof=1.

