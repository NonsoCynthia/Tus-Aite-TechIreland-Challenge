coupling:
  coupling_coefficient:
    value: 1.0
    kind: fitted
    note: >-
      Originally introduced as a modelled parameter to weaken MIMIC's vitals-to-acuity
      coupling, on the reasoning that Irish CPC is assigned from a referral letter rather
      than at the bedside. A sweep across 0.3-5.0 found the measured correlation never
      exceeds 0.30 at any value, because NEWS2 does not discriminate triage acuity in the
      first place. No weakening is needed: MIMIC's own coupling is already far below the
      level at which circularity would be a concern. The parameter is retained at 1.0 for
      transparency and to preserve the ability to test sensitivity later.
    applies_to: between-category mean separation only
    does_not_apply_to: within-category spread, which stays at the MIMIC-fitted SD values above
    semantics: >-
      For each vital, the category means are shrunk toward the pooled cross-category mean by this
      factor: adjusted_mean = pooled_mean + coupling_coefficient * (category_mean - pooled_mean).
      A value of 1.0 reproduces MIMIC's coupling exactly; 0.0 makes physiology independent of
      assigned category. The SDs are left untouched.
    sweep_result:
      swept_range: [0.3, 5.0]
      measured_abs_r:
        "0.4": 0.154
        "0.6": 0.190
        "0.8": 0.219
        "1.0": 0.239
        "1.5": 0.253
        "2.0": 0.227
        "3.0": 0.105
        "5.0": 0.295
      conclusion: >-
        Peak |r| of 0.253 at coupling 1.5. The original 0.35-0.65 acceptance band from
        BUILD_MANUAL section 10.4 is unreachable at any coupling value, including values
        above 1.0 that would amplify beyond MIMIC's measured separation. The band was
        specified without checking whether NEWS2 discriminates triage acuity; it does not.
        See docs/HOW_THE_DATA_WAS_MADE.md. The sweep is a result, not a discarded step.

disagreement:
  gp_triage_disagreement_rate:
    value: 0.18
    kind: assumed
    note: >-
      No published source gives how often a GP-assigned priority and the receiving service's
      assigned triage category differ. This figure is not measured, not fitted, and not derived
      from any dataset - it is a placeholder so the pipeline can run. Every result that depends on
      it MUST be flagged as unvalidated wherever it is reported.

parameter_counts:
  fitted: 21
  modelled: 5
  assumed: 1
  total: 27

vitals_correlation:
  kind: fitted
  note: 'Within-category Pearson correlation between vitals, measured from the same MIMIC rows the means
    and SDs came from. Drawing each vital independently discards this structure and makes NEWS2 tighter
    than the source data, because independent components average out. Routine is absent: it is derived
    from reference ranges, not fitted, so it has no measured covariance.'
  variables: &id001 [heartrate, resprate, temperature_c, o2sat, sbp, dbp]
  by_category:
    Urgent:
      n: 102
      order: *id001
      matrix:
      - [1.0, 0.2181, 0.2352, 0.0081, -0.07, 0.1377]
      - [0.2181, 1.0, 0.2225, -0.2472, 0.007, 0.0796]
      - [0.2352, 0.2225, 1.0, -0.2451, 0.1756, 0.0804]
      - [0.0081, -0.2472, -0.2451, 1.0, -0.0319, 0.1013]
      - [-0.07, 0.007, 0.1756, -0.0319, 1.0, 0.6581]
      - [0.1377, 0.0796, 0.0804, 0.1013, 0.6581, 1.0]
    Semi-Urgent:
      n: 88
      order: *id001
      matrix:
      - [1.0, 0.1275, 0.118, -0.0613, -0.0978, 0.2765]
      - [0.1275, 1.0, 0.1168, 0.1344, 0.1333, 0.1003]
      - [0.118, 0.1168, 1.0, -0.1259, 0.0325, 0.0712]
      - [-0.0613, 0.1344, -0.1259, 1.0, -0.1568, 0.1787]
      - [-0.0978, 0.1333, 0.0325, -0.1568, 1.0, 0.2198]
      - [0.2765, 0.1003, 0.0712, 0.1787, 0.2198, 1.0]

sampling:
  method: smoothed_bootstrap
  kind: modelled
  pool_file: generator/calibration/mimic_vitals_pool.csv
  applies_to: [Urgent, Semi-Urgent]
  reason: >-
    Urgent and Semi-Urgent vitals are drawn by resampling the real MIMIC rows and adding
    a small jitter, rather than by drawing from a fitted Gaussian. Real triage vitals are
    skewed, heavy-tailed, correlated within a patient, and pile up against physiological
    ceilings such as SpO2 at 100 per cent. A Gaussian fitted to their means and SDs
    reproduces none of that, and measurably separates the categories more cleanly than the
    source data does: AUC 0.73 against MIMIC's own 0.65. Resampling reproduces the real
    distribution because it is the real distribution. Routine is excluded -- it has only 2
    source rows and is generated from reference ranges instead.
  jitter_sd_fraction:
    value: 0.20
    kind: modelled
    reason: >-
      Noise added at 0.20 of each column's SD. With ~5,200 referrals drawn from 190 source
      rows, resampling alone would repeat each real patient about 27 times; the jitter
      breaks exact duplication while preserving distribution shape. Measured AUC is
      insensitive to it across 0.00-0.30 (0.6465, 0.6510, 0.6452, 0.6444), so the value is
      not load-bearing.
  licence_note: >-
    MIMIC-IV-ED Demo is ODbL 1.0, which permits redistribution with attribution. The pool
    file carries 190 rows of vitals only, no identifiers, from the open demo subset.

realism_gate:
  auc_mimic:
    value: 0.6516
    kind: fitted
    ci95: [0.5789, 0.7230]
    bootstrap_resamples: 4000
    seed: 20260830
    n_urgent: 102
    n_semi_urgent: 88
    definition: >-
      AUC of news2 discriminating Urgent (ESI 1-2) from Semi-Urgent (ESI 3) in the MIMIC
      source rows. Routine is excluded: it is modelled from reference ranges, not fitted,
      and would otherwise contaminate the metric.
  tolerance:
    value: 0.05
    kind: modelled
    reason: >-
      One-sided slack for generative modelling. Looser overlap than reality passes; only
      cleaner-than-real separation fails, which is the direction worth catching.
  assertion: auc_generated <= auc_mimic + tolerance
  rationale: >-
    This is a REALISM check, not a circularity guard. triage_category is an input the
    urgency agent reads directly; it never predicts it, so recoverability of the category
    from vitals gains an agent nothing. The circularity risk in this build lives entirely
    in latent_hazard, which must never derive from anything the agent can see. What this
    gate asserts is that our synthetic data is not tidier than real triage data.
